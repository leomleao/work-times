services:
  work-times:
    build:
      context: .
      dockerfile: Dockerfile
    image: work-times:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/work-times.sqlite
      HOST: 0.0.0.0
      PORT: 3002
    ports:
      - "127.0.0.1:${WORK_TIMES_PORT:-3002}:3002"
    volumes:
      - work-times-data:/data

volumes:
  work-times-data:
